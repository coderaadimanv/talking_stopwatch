name: talking_stopwatch
description: "A stopwatch that talks, so you never look at it mid-workout."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Jost, the brand's typeface. One variable file covers every weight the app
  # uses, which is smaller than four static cuts would be. The licence ships
  # with it because the SIL OFL says it must.
  fonts:
    - family: Jost
      fonts:
        - asset: assets/fonts/Jost-Variable.ttf

  assets:
    - assets/fonts/OFL.txt
